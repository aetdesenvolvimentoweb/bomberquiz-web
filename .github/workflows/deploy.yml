name: Deploy

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # TODO: adicionar quando existir "bun run lint"
      # - run: bun run lint

      - run: bun run test

      # TODO: adicionar quando existirem testes e2e (Playwright)
      # - run: bun run test:e2e

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref_name }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_BASE_URL: https://api.bomberquiz.com.br
          # DSN não é segredo (vai embutido no bundle público de qualquer forma).
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Habilita o upload de sourcemap (@sentry/vite-plugin em vite.config.ts) —
          # sem os três, o plugin não entra no build e o passo segue normal.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 91f587f1f28c
          SENTRY_PROJECT: bomberquiz-web

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name=bomberquiz-web --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
